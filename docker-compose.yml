version: "3.9"

services:
  db:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data

  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-1
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    env_file:
      - .env
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-3000}
    depends_on:
      - db
      - redis
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /usr/src/app/src
          initial_sync: true
          ignore:
            - node_modules/
        - action: rebuild
          path: ./backend/package.json

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-2
    ports:
      - "${BACKEND_PORT2:-3001}:${BACKEND_PORT2:-3001}"
    env_file:
      - .env
    environment:
      - BACKEND_PORT=${BACKEND_PORT2:-3001}
    depends_on:
      - db
      - redis
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /usr/src/app/src
          initial_sync: true
          ignore:
            - node_modules/
        - action: rebuild
          path: ./backend/package.json

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]

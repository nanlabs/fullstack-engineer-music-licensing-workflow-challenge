[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/errx",
    "crates/iam",
    "crates/licensing",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"

[workspace.dependencies]
# Internal crates
kernel = { path = "crates/kernel" }
errx = { path = "crates/errx" }
iam = { path = "crates/iam" }
licensing = { path = "crates/licensing" }

# Web
actix-web = "4.18"
actix-cors = "0.7"
tracing-actix-web = { version = "0.7.25", features = ["opentelemetry_0_32"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Persistence
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono"] }

# Serialization and validation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.21", features = ["derive"] }

# Primitives
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
humantime = "2"
dotenvy = "0.15"

# Security
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
base64 = "0.22"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace", "logs", "internal-logs"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-semantic-conventions = { version = "0.32", features = ["semconv_experimental"] }
tracing-opentelemetry = "0.33"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

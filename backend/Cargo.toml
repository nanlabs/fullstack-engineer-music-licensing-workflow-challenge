[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }

sea-orm = { version = "2.0.2", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

uuid = { version = "1.25.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
thiserror = "2.0.20"

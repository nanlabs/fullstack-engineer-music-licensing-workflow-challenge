services:
  # ===========================================
  # Infrastructure Services
  # ===========================================

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: licensing-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Databases - One per microservice
  # ===========================================

  postgres-movie:
    image: postgres:15-alpine
    container_name: licensing-postgres-movie
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: movie_db
    volumes:
      - postgres_movie_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-song:
    image: postgres:15-alpine
    container_name: licensing-postgres-song
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: song_db
    volumes:
      - postgres_song_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-track:
    image: postgres:15-alpine
    container_name: licensing-postgres-track
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: track_db
    volumes:
      - postgres_track_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Microservices
  # ===========================================

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api-gateway
    container_name: licensing-api-gateway
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      BACKEND_PORT: 3000
      API_GATEWAY_HOST: api-gateway
      API_GATEWAY_PORT: 5000
      RMQ_HOST: rabbitmq
      RMQ_PORT: 5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  movie:
    build:
      context: .
      dockerfile: Dockerfile.movie
    container_name: licensing-movie
    environment:
      API_GATEWAY_HOST: api-gateway
      API_GATEWAY_PORT: 5000
      RMQ_HOST: rabbitmq
      RMQ_PORT: 5672
      DB_HOST: postgres-movie
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: docker
      DB_NAME: movie_db
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-movie:
        condition: service_healthy

  song:
    build:
      context: .
      dockerfile: Dockerfile.song
    container_name: licensing-song
    environment:
      API_GATEWAY_HOST: api-gateway
      API_GATEWAY_PORT: 5000
      RMQ_HOST: rabbitmq
      RMQ_PORT: 5672
      DB_HOST: postgres-song
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: docker
      DB_NAME: song_db
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-song:
        condition: service_healthy

  track:
    build:
      context: .
      dockerfile: Dockerfile.track
    container_name: licensing-track
    environment:
      API_GATEWAY_HOST: api-gateway
      API_GATEWAY_PORT: 5000
      RMQ_HOST: rabbitmq
      RMQ_PORT: 5672
      DB_HOST: postgres-track
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: docker
      DB_NAME: track_db
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-track:
        condition: service_healthy

volumes:
  postgres_movie_data:
  postgres_song_data:
  postgres_track_data:

openapi: 3.0.0
paths:
  /:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - App
  /movies:
    post:
      operationId: MoviesController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMovieDto"
      responses:
        "201":
          description: The movie has been successfully created.
      summary: Create a new movie
      tags: &a1
        - movies
    get:
      operationId: MoviesController_findAll
      parameters: []
      responses:
        "200":
          description: Return all movies.
      summary: Get all movies
      tags: *a1
  /movies/{id}:
    get:
      operationId: MoviesController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Return the movie.
        "404":
          description: Movie not found.
      summary: Get a movie by ID
      tags: *a1
    patch:
      operationId: MoviesController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMovieDto"
      responses:
        "200":
          description: The movie has been successfully updated.
      summary: Update a movie
      tags: *a1
    delete:
      operationId: MoviesController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: The movie has been successfully deleted.
      summary: Delete a movie
      tags: *a1

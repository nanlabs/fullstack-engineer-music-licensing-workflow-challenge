info:
  title: Music Licensing Workflow API
  description: API for managing movies, scenes, songs, and licensing tracks
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  schemas:
    CreateMovieDto:
      type: object
      properties:
        title:
          type: string
          example: Inception
          description: The title of the movie
        releaseYear:
          type: number
          example: 2010
          description: The release year of the movie
      required:
        - title
        - releaseYear
    UpdateMovieDto:
      type: object
      properties:
        title:
          type: string
          example: Inception
          description: The title of the movie
        releaseYear:
          type: number
          example: 2010
          description: The release year of the movie
    CreateSceneDto:
      type: object
      properties:
        name:
          type: string
          example: Opening Scene
          description: The name of the scene
        description:
          type: string
          example: Dream within a dream
          description: Description of the scene
        movieId:
          type: string
          example: uuid-of-movie
          description: The ID of the movie this scene belongs to
      required:
        - name
        - movieId
    UpdateSceneDto:
      type: object
      properties:
        name:
          type: string
          example: Opening Scene
          description: The name of the scene
        description:
          type: string
          example: Dream within a dream
          description: Description of the scene
        movieId:
          type: string
          example: uuid-of-movie
          description: The ID of the movie this scene belongs to
    CreateSongDto:
      type: object
      properties:
        title:
          type: string
          example: Time
          description: The title of the song
        artist:
          type: string
          example: Hans Zimmer
          description: The artist of the song
        duration:
          type: number
          example: 275
          description: Duration of the song in seconds
      required:
        - title
        - artist
        - duration
    UpdateSongDto:
      type: object
      properties:
        title:
          type: string
          example: Time
          description: The title of the song
        artist:
          type: string
          example: Hans Zimmer
          description: The artist of the song
        duration:
          type: number
          example: 275
          description: Duration of the song in seconds
    CreateTrackDto:
      type: object
      properties:
        sceneId:
          type: string
          example: uuid-of-scene
          description: The ID of the scene
        songId:
          type: string
          example: uuid-of-song
          description: The ID of the song
        startTime:
          type: number
          example: 0
          description: Start time of the track in the scene (seconds)
        endTime:
          type: number
          example: 60
          description: End time of the track in the scene (seconds)
      required:
        - sceneId
        - songId
        - startTime
        - endTime
    UpdateTrackDto:
      type: object
      properties:
        sceneId:
          type: string
          example: uuid-of-scene
          description: The ID of the scene
        songId:
          type: string
          example: uuid-of-song
          description: The ID of the song
        startTime:
          type: number
          example: 0
          description: Start time of the track in the scene (seconds)
        endTime:
          type: number
          example: 60
          description: End time of the track in the scene (seconds)
        status:
          type: string
          enum:
            - PENDING
            - NEGOTIATING
            - APPROVED
            - REJECTED
          description: The licensing status of the track

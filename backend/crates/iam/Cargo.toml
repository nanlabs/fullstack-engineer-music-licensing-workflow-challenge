[package]
name = "iam"
description = "Identity and access bounded context: tenants, users, roles, invitations, OTP, sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
kernel = { workspace = true }
errx = { workspace = true }

actix-web = { workspace = true }
actix-http = { workspace = true, optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
getrandom = { workspace = true }
jsonwebtoken = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
validator = { workspace = true }

[features]
# Test helpers (`iam::testing`): fake notifiers, request helpers, OTP login.
test-support = ["dep:actix-http"]

[dev-dependencies]
# Lets this crate's own integration tests use `iam::testing` without flags.
iam = { path = ".", features = ["test-support"] }

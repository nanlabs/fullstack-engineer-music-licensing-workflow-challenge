# The compiler every build uses: local (rustup reads this file), CI
# (dtolnay/rust-toolchain@1.95.0) and Docker (cargo-chef:latest-rust-1.95.0).
# `rust-version` in Cargo.toml declares the same version: the minimum we
# support is the one we test. Bump all four together.
[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]
profile = "minimal"

services:
  postgres:
    image: postgres:15-alpine
    container_name: acme_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: acme_licensing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d acme_licensing"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env

    container_name: acme_backend
    command: >
      sh -c "npx prisma migrate deploy && 
             npx prisma db seed && 
             node dist/src/main.js"
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/acme_licensing?schema=public
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:3000
        - VITE_SOCKET_URL=http://localhost:3000/licensing
    container_name: acme_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "compose.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "compose.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, test, SQLx, and image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: music_licensing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d music_licensing"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/music_licensing

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint every target
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run all Rust tests
        run: cargo test --all-features --locked

      - name: Install matching SQLx CLI
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,postgres --locked

      - name: Apply migrations for SQLx validation
        run: cargo sqlx migrate run

      - name: Verify committed SQLx metadata
        run: cargo sqlx prepare --check

      - name: Build production image
        run: docker build --file Dockerfile --tag music-licensing-api:ci .

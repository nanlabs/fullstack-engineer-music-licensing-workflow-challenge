name: CI Pipeline

# Cuándo se ejecuta este pipeline
on:
  push:
    branches: [ main, develop ]  # Solo en las ramas principales
  pull_request:
    branches: [ main, develop ]  # Cuando abres un PR

jobs:
  # 1. LINT - Revisar calidad de código
  lint:
    name: "🧹 Code Quality Check"
    runs-on: ubuntu-latest
    
    steps:
      - name: "📥 Get the code"
        uses: actions/checkout@v4
      
      - name: "🔧 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: "📦 Install dependencies"
        run: |
          npm ci
          cd backend && npm install
      
      - name: "🔍 Check code style (ESLint)"
        run: cd backend && npm run lint
      
      - name: "💅 Check code formatting (Prettier)"
        run: cd backend && npm run format

  # 2. BUILD - Compilar la aplicación
  build:
    name: "🏗️ Build Application"
    runs-on: ubuntu-latest
    needs: lint  # Solo ejecuta si lint pasó
    
    steps:
      - name: "📥 Get the code"
        uses: actions/checkout@v4
      
      - name: "🔧 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: "📦 Install dependencies"
        run: |
          npm ci
          cd backend && npm install
      
      - name: "🏗️ Build the app"
        run: cd backend && npm run build

  # 3. TEST - Ejecutar tests
  test:
    name: "🧪 Run Tests"
    runs-on: ubuntu-latest
    needs: lint
    
    # Base de datos PostgreSQL para los tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: music_licensing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    # Variables de entorno para conectar a la BD
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: music_licensing_test
    
    steps:
      - name: "📥 Get the code"
        uses: actions/checkout@v4
      
      - name: "🔧 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: "📦 Install dependencies"
        run: |
          npm ci
          cd backend && npm install
      
      - name: "🗄️ Setup database"
        run: cd backend && npm run migration:run
      
      - name: "🧪 Run tests with coverage"
        run: cd backend && npm run test:cov

  # 4. SECURITY - Revisar vulnerabilidades
  security:
    name: "🛡️ Security Check"
    runs-on: ubuntu-latest
    
    steps:
      - name: "📥 Get the code"
        uses: actions/checkout@v4
      
      - name: "🔧 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: "📦 Install dependencies"
        run: |
          npm ci
          cd backend && npm install
      
      - name: "🔍 Check for vulnerabilities"
        run: |
          npm audit --audit-level moderate || true
          cd backend && npm audit --audit-level moderate || true
